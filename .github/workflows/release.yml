# macOS 公式バイナリのリリース: アーカイブ → Developer ID 署名 → 公証 → staple → zip / dmg → GitHub Release（下書き）に添付。
# Phase 0 #47（署名方式の確定）の判定待ちの先行実装。Secrets を登録するまでは最初のステップで失敗し、何も作らない。
# 起動は明示操作だけ: v* タグの push か、Actions 画面からの手動実行（Use workflow from で既存のタグを選ぶ）。
# pull_request / pull_request_target では起動しない（フォークの PR に secrets を渡さない）。
# 手順と Secrets の一覧は docs/ビルド・配布規約.md「リリース」。
name: Release

on:
  push:
    tags: ['v*']
  # 手動実行はタグを選んだときだけ進む（Environment のタグ制限は選んだ ref に対して効くため、入力でタグを受け取らない）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 署名・公証・リリース
    runs-on: macos-26
    # 公証の待ちは 1 回 20 分まで × 2 回（アプリと dmg）
    timeout-minutes: 90
    # 承認者（required reviewers）とデプロイできるタグ（v*）を Environment の設定で絞る
    environment: release
    permissions:
      # GitHub Release の作成と成果物の添付だけに使う
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Secrets と変数がそろっているか確認
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          UTTER_BUNDLE_ID_PREFIX: ${{ vars.UTTER_BUNDLE_ID_PREFIX }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          missing=()
          for name in MACOS_DEVELOPER_ID_P12_BASE64 MACOS_DEVELOPER_ID_P12_PASSWORD APPLE_TEAM_ID \
            ASC_API_KEY_P8_BASE64 ASC_API_KEY_ID ASC_API_ISSUER_ID UTTER_BUNDLE_ID_PREFIX; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=リリースの設定がありません::Environment release の secrets / variables に次を登録してください: ${missing[*]}（docs/ビルド・配布規約.md「リリース」）"
            exit 1
          fi
          # 自動更新（Sparkle、#47 の判定待ちで既定無効）は秘密鍵と公開鍵の両方があるときだけ有効。片方だけなら設定漏れとして止める
          if [[ -n "$SPARKLE_ED_PRIVATE_KEY" && -n "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo "UTTER_SPARKLE_ENABLED=true" >>"$GITHUB_ENV"
            echo "自動更新（Sparkle）: 有効"
          elif [[ -n "$SPARKLE_ED_PRIVATE_KEY" || -n "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo "::error title=自動更新の設定が一部だけです::secret SPARKLE_ED_PRIVATE_KEY と variable SPARKLE_PUBLIC_ED_KEY は両方登録するか、両方とも消してください（docs/ビルド・配布規約.md「リリース」）"
            exit 1
          else
            echo "自動更新（Sparkle）: 無効（SPARKLE_ED_PRIVATE_KEY / SPARKLE_PUBLIC_ED_KEY が未登録）"
          fi
          echo "必要な secrets と変数がそろっています。"

      - name: タグの形式を確認
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::タグから実行してください（手動実行は Use workflow from でタグを選ぶ）。"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::タグは v0.1.0 や v0.1.0-beta.1 の形にしてください。"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: ツールのバージョンを表示
        run: |
          xcodebuild -version
          swift --version

      - name: xcodegen をインストール
        run: brew install xcodegen

      - name: 署名用の一時キーチェーンと公証用 API キーを用意
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/utter-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          api_key="$RUNNER_TEMP/asc-api-key.p8"
          # キーチェーンのパスワードはこのジョブだけの使い捨て。ログに出ないようマスクする
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | base64 --decode >"$certificate"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode >"$api_key"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 >/dev/null
          rm -f "$certificate"
          # codesign がパスワードの入力を求めずに鍵を使えるようにする（出力は鍵の属性なので捨てる）
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # 既存の検索リストの先頭に一時キーチェーンを足す
          existing="$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$keychain" $existing

          if ! security find-identity -v -p codesigning "$keychain" | grep -q 'Developer ID Application'; then
            echo "::error::MACOS_DEVELOPER_ID_P12_BASE64 に Developer ID Application の証明書と秘密鍵が含まれていません。"
            exit 1
          fi
          {
            echo "UTTER_KEYCHAIN_PATH=$keychain"
            echo "ASC_API_KEY_PATH=$api_key"
          } >>"$GITHUB_ENV"

          # 自動更新の EdDSA 秘密鍵（generate_keys -x で書き出したファイルの中身）。有効なときだけ置く
          if [[ "${UTTER_SPARKLE_ENABLED:-}" == "true" ]]; then
            sparkle_key="$RUNNER_TEMP/sparkle-ed-private-key"
            printf '%s' "$SPARKLE_ED_PRIVATE_KEY" >"$sparkle_key"
            echo "SPARKLE_ED_PRIVATE_KEY_PATH=$sparkle_key" >>"$GITHUB_ENV"
          fi

      - name: アーカイブ・署名・公証・staple・zip / dmg
        env:
          UTTER_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UTTER_BUNDLE_ID_PREFIX: ${{ vars.UTTER_BUNDLE_ID_PREFIX }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          UTTER_BUILD_NUMBER: ${{ github.run_number }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          export UTTER_VERSION="${RELEASE_TAG#v}"
          if [[ "${UTTER_SPARKLE_ENABLED:-}" == "true" ]]; then
            # appcast は各 Release に添付し、最新の公開済み Release のものを配る（下書き・プレリリースは配らない）
            export UTTER_SPARKLE_FEED_URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml"
            export UTTER_SPARKLE_DOWNLOAD_URL_PREFIX="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/"
            export UTTER_SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY"
          fi
          scripts/release-macos.sh

      - name: GitHub Release（下書き）を作成して添付
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # 再実行で下書きが重複しないよう、同じタグの Release（下書きを含む）があれば止める
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$RELEASE_TAG の Release が既にあります。内容を確かめて削除してから再実行してください。"
            exit 1
          fi
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          assets=("build/release/utter-$version.zip" "build/release/utter-$version.dmg" "build/release/SHA256SUMS.txt")
          if [[ "${UTTER_SPARKLE_ENABLED:-}" == "true" ]]; then
            assets+=("build/release/appcast.xml")
          fi
          # 下書きで作る。計測結果と既知の制限（AC-19）を本文に書いてから、人が公開する
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            ${prerelease[@]+"${prerelease[@]}"} \
            --title "utter $version" \
            --generate-notes \
            "${assets[@]}"

      - name: 一時キーチェーンと API キーを削除
        if: always()
        run: |
          # 準備の途中で失敗した場合も消すため、GITHUB_ENV ではなく決まったパスを使う
          keychain="$RUNNER_TEMP/utter-signing.keychain-db"
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain" || true
          fi
          rm -f "$RUNNER_TEMP/asc-api-key.p8" "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/sparkle-ed-private-key"
