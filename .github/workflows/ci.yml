name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 検証（${{ matrix.part }}）
    # macOS 26 / Xcode 26 以降が前提（SpeechAnalyzer・Swift 6）
    runs-on: macos-26
    timeout-minutes: 30
    # macOS 側（Package の build/test・macOS アプリ・lint）と iOS 側（iOS Simulator 向けのビルド）を並列に動かす
    strategy:
      fail-fast: false
      matrix:
        part: [macos, ios]
    steps:
      - uses: actions/checkout@v7

      - name: ツールのバージョンを表示
        run: |
          xcodebuild -version
          swift --version

      - name: shellcheck・xcodegen・actionlint をインストール
        run: brew install shellcheck xcodegen actionlint

      - run: scripts/verify.sh ${{ matrix.part }}

      # macOS アプリのテストが落ちたとき、失敗した期待値を xcresult で確かめられるようにする（#193）
      - name: テスト結果を保存
        if: failure() && matrix.part == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: UtterMac-xcresult
          path: build/TestResults/UtterMac.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ci-status:
    name: CI ステータス確認
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: 検証の成功を確認
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "CI検証結果: $VERIFY_RESULT"
            exit 1
          fi
          echo "CI検証に成功しました"
