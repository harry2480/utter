name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  verify:
    name: 検証
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: starter_templete
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d starter_templete"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/starter_templete?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/starter_templete?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter webapp exec prisma migrate deploy
      - run: pnpm verify
      - run: pnpm build

  ci-status:
    name: CI ステータス確認
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: 検証の成功を確認
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "CI検証結果: $VERIFY_RESULT"
            exit 1
          fi
          echo "CI検証に成功しました"
