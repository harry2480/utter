name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 検証
    # macOS 26 / Xcode 26 以降が前提（SpeechAnalyzer・Swift 6）
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: ツールのバージョンを表示
        run: |
          xcodebuild -version
          swift --version

      - name: shellcheck・xcodegen・actionlint をインストール
        run: brew install shellcheck xcodegen actionlint

      - run: scripts/verify.sh

  ci-status:
    name: CI ステータス確認
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: 検証の成功を確認
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "CI検証結果: $VERIFY_RESULT"
            exit 1
          fi
          echo "CI検証に成功しました"
