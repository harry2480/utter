name: Dependabot自動マージ

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot更新情報を取得
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: patch/minor更新の自動マージを有効化
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          EXCLUDED_DEPENDENCIES: ${{ vars.DEPENDABOT_AUTOMERGE_EXCLUDED_DEPENDENCIES }}
        run: |
          set -euo pipefail
          dependency_names="$(printf '%s' "$DEPENDENCY_NAMES" | tr -d ' ')"
          while IFS= read -r dependency; do
            [ -n "$dependency" ] || continue
            dependency="$(printf '%s' "$dependency" | sed 's/^ *//; s/ *$//')"
            case ",$dependency_names," in
              *,"$dependency",*)
                echo "$dependency は自動マージ対象外です"
                exit 0
                ;;
            esac
          done < <(printf '%s' "$EXCLUDED_DEPENDENCIES" | tr ',' '\n')

          gh pr merge "$PR_URL" --auto --squash
