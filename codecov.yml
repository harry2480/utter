# Codecov 設定
# 詳細: https://docs.codecov.com/docs/codecovyml-reference
codecov:
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "60...90"
  status:
    project:
      default:
        # 初期はカバレッジでCIを落とさず、推移の可視化を優先する
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "diff, flags, files"
  require_changes: true

ignore:
  - "**/Tests/**"
  - "Apps/**"
  - "Extensions/**"
  - "Workers/**"
