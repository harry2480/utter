# iOS 本体アプリの Xcode プロジェクト定義。
# 生成: xcodegen generate --spec Apps/iOS/project.yml
# 生成した Utter.xcodeproj はコミットしない（.gitignore。project.yml が正）。
# Team ID・Bundle ID は Config/Local.xcconfig（gitignore 済み）で上書きする（docs/ビルド・配布規約.md）。
name: Utter
options:
  # 最低バージョンは Phase i0（#54）で確定するまでの仮の値。Packages/*/Package.swift の .iOS(...) とそろえる
  # （scripts/verify.sh が一致を確かめる）。ターゲット側で deploymentTarget を上書きしない
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: ../../Config/Base.xcconfig
  Release: ../../Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  UtterCore:
    path: ../../Packages/UtterCore
targets:
  UtteriOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: UtterCore
    settings:
      base:
        PRODUCT_NAME: utter
        PRODUCT_BUNDLE_IDENTIFIER: $(UTTER_BUNDLE_ID_PREFIX).ios
        CODE_SIGN_STYLE: Automatic
        # iPhone のみ（本人所有の iPhone への実機インストールが対象, 1章）
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: utter
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # 権限の用途説明（マイク・音声認識など）・App Group・Entitlement は、その機能を実装する PR で追加する（PERM-01）。
        # App Group は無料署名で使えるかの判定（#56）待ち
schemes:
  UtteriOS:
    build:
      targets:
        UtteriOS: all
    run:
      config: Debug
