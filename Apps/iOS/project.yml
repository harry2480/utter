# iOS 本体アプリの Xcode プロジェクト定義。
# 生成: xcodegen generate --spec Apps/iOS/project.yml
# 生成した Utter.xcodeproj はコミットしない（.gitignore。project.yml が正）。
# Team ID・Bundle ID は Config/Local.xcconfig（gitignore 済み）で上書きする（docs/ビルド・配布規約.md）。
name: Utter
options:
  # 最低バージョンは Phase i0（#54）で確定するまでの仮の値。Packages/*/Package.swift の .iOS(...) とそろえる
  # （scripts/verify.sh が一致を確かめる）。ターゲット側で deploymentTarget を上書きしない
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: ../../Config/Base.xcconfig
  Release: ../../Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  UtterCore:
    path: ../../Packages/UtterCore
  UtterSpeech:
    path: ../../Packages/UtterSpeech
  UtterAI:
    path: ../../Packages/UtterAI
  UtterPersistence:
    path: ../../Packages/UtterPersistence
  # 録音セッションの進行・割り込みの変換・結果の保存先の選択・クラウド整形の結線（OS の API を使わずにテストする部分）
  UtteriOSKit:
    path: UtteriOSKit
targets:
  UtteriOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: UtterCore
      - package: UtterSpeech
      - package: UtterAI
      - package: UtterPersistence
      - package: UtteriOSKit
    settings:
      base:
        PRODUCT_NAME: utter
        PRODUCT_BUNDLE_IDENTIFIER: $(UTTER_BUNDLE_ID_PREFIX).ios
        CODE_SIGN_STYLE: Automatic
        # iPhone のみ（本人所有の iPhone への実機インストールが対象, 1章）
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        # 自動生成に足す独自のキー（App Group ID）だけを置く
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: utter
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # 権限の用途説明は、この PR で使うマイクだけ（PERM-01）。音声認識（Speech）は STT エンジンを結線する PR で追加する
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 話した内容を文字にするため、録音中だけマイクを使います。音声は保存・送信しません。
        # App Group は無料署名で使えるかの判定（#56）待ちのため既定では使わない。Config/Local.xcconfig で
        # UTTER_APP_GROUP_ID と UTTER_IOS_CODE_SIGN_ENTITLEMENTS（UtteriOS-AppGroup.entitlements）を設定したときだけ有効にする
        CODE_SIGN_ENTITLEMENTS: $(UTTER_IOS_CODE_SIGN_ENTITLEMENTS)
schemes:
  UtteriOS:
    build:
      targets:
        UtteriOS: all
    run:
      config: Debug
