# マイクの権限（PERM-01）。project.yml の include で読み込む
# 権限の用途説明と Entitlement は、その権限を実際に要求する PR で追加する。
# マイクは権限オンボーディングの画面から要求する。音声認識は要否の判定（#48）後に追加する
targets:
  UtterMac:
    # Hardened Runtime で録音するために要る（PERM-01）。権限を要求する機能の分だけ足す
    entitlements:
      path: Sources/UtterMac.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 話した内容を文字にするため、録音にマイクを使います。
