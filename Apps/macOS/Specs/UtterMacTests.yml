# アプリのユニットテストのターゲット（UtterMacTests）と、UtterMac のスキームでのテスト実行。project.yml の include で読み込む
targets:
  # 画面の状態（View を除く）のユニットテスト。アプリを起動しないよう、テスト対象のソースを直接コンパイルする
  UtterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Dictionary/DictionaryEditorModel.swift
    dependencies:
      - package: UtterText
      - package: UtterPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UTTER_BUNDLE_ID_PREFIX).mac.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  UtterMac:
    test:
      config: Debug
      targets:
        - UtterMacTests
