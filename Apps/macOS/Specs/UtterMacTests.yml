# アプリのユニットテストのターゲット（UtterMacTests）と、UtterMac のスキームでのテスト実行。project.yml の include で読み込む
targets:
  # 画面を除くロジックのユニットテスト。アプリを起動しないよう、テスト対象のソースを直接コンパイルする（TEST_HOST なし）
  UtterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Shortcut
      - path: Sources/Insertion
      - path: Sources/RealtimeDirect
      - path: Sources/EditMode
      - path: Sources/Session
      # Session が使う性能計測の区間（#52）。区間名・Signpost の発行・整形の送信の計測
      - path: Sources/Performance
      # 一時音声の保存と起動時の復旧（確認のダイアログを含む。テストからは開かない）
      - path: Sources/Recovery
      # Session が使う型（TaskHUDRefreshScheduler）と、表示の依頼のまとめ（HUDDisplayQueue）。パネルと画面は含めない
      - path: Sources/HUD/TaskHUDRefreshScheduler.swift
      - path: Sources/HUD/HUDDisplayQueue.swift
      # 辞書の編集画面の状態（View を除く）
      - path: Sources/Dictionary/DictionaryEditorModel.swift
      # 設定画面の状態（View を除く）
      - path: Sources/Settings
        excludes:
          - "Views/**"
      # 初回セットアップの手順・進み具合と権限オンボーディングの状態（画面と OS の権限 API のアダプターは含めない, #198）
      - path: Sources/Permissions
        excludes:
          - "*View.swift"
          - "*Scene.swift"
          - "SystemPermissionAccess.swift"
      # 録音の割り込みの値（録音エンジンのアダプターは含めない）
      - path: Sources/Audio/MacRecordingInterruptions.swift
    dependencies:
      - package: UtterCore
      - package: UtterSpeech
      - package: UtterText
      - package: UtterAI
      - package: UtterPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UTTER_BUNDLE_ID_PREFIX).mac.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  UtterMac:
    test:
      config: Debug
      targets:
        - UtterMacTests
