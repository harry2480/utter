# アプリのユニットテストのターゲット（UtterMacTests）と、UtterMac のスキームでのテスト実行。project.yml の include で読み込む
targets:
  # アプリの純粋なロジック（Sources/Shortcut）のユニットテスト。
  # アプリを起動しないよう、テスト対象のソースをテストバンドルに直接含める（TEST_HOST なし）
  UtterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Shortcut
      - path: Tests
    dependencies:
      - package: UtterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UTTER_BUNDLE_ID_PREFIX).mac.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  UtterMac:
    test:
      config: Debug
      targets:
        - UtterMacTests
