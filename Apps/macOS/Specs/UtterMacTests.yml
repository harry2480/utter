# アプリのユニットテストのターゲット（UtterMacTests）と、UtterMac のスキームでのテスト実行。project.yml の include で読み込む
targets:
  # 画面を除くロジックのユニットテスト。アプリを起動しないよう、テスト対象のソースを直接コンパイルする（TEST_HOST なし）
  UtterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Shortcut
      - path: Sources/Insertion
      - path: Sources/Session
      # Session が使う型（TaskHUDRefreshScheduler）。パネルと画面は含めない
      - path: Sources/HUD/TaskHUDRefreshScheduler.swift
      # 画面の状態（View を除く）
      - path: Sources/Settings
        excludes:
          - "Views/**"
      - path: Sources/Dictionary/DictionaryEditorModel.swift
      # 録音の割り込みの値（録音エンジンのアダプターは含めない）
      - path: Sources/Audio/MacRecordingInterruptions.swift
    dependencies:
      - package: UtterCore
      - package: UtterSpeech
      - package: UtterAI
      - package: UtterText
      - package: UtterPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UTTER_BUNDLE_ID_PREFIX).mac.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  UtterMac:
    test:
      config: Debug
      targets:
        - UtterMacTests
