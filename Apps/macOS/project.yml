# macOS アプリ（メニューバー常駐）の Xcode プロジェクト定義。
# 生成: xcodegen generate --spec Apps/macOS/project.yml
# 生成した Utter.xcodeproj はコミットしない（.gitignore。project.yml が正）。
# Team ID・Bundle ID は Config/Local.xcconfig（gitignore 済み）で上書きする（docs/ビルド・配布規約.md）。
name: Utter
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: ../../Config/Base.xcconfig
  Release: ../../Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  UtterCore:
    path: ../../Packages/UtterCore
  UtterSpeech:
    path: ../../Packages/UtterSpeech
  UtterAI:
    path: ../../Packages/UtterAI
targets:
  UtterMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: UtterCore
      - package: UtterSpeech
      - package: UtterAI
      # XPC STT Worker を utter.app/Contents/XPCServices に組み込む
      - target: UtterSTTWorker
    settings:
      base:
        PRODUCT_NAME: utter
        PRODUCT_BUNDLE_IDENTIFIER: $(UTTER_BUNDLE_ID_PREFIX).mac
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: utter
        # メニューバー常駐で Dock に出さない
        INFOPLIST_KEY_LSUIElement: "YES"
        # 権限の用途説明と Entitlement は、その機能を実装する PR で追加する（PERM-01）
        # マイク: 録音（REC-04）。初めて録音するときに OS がこの文言を添えて尋ねる
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 話した内容を文字にするため、録音中だけマイクを使います。
        # グローバルショートカット（RegisterEventHotKey）は権限を要求しない
        # 修飾キー単独（入力監視）と Esc 捕捉（アクセシビリティ）は #51 の判定待ちで既定で無効。
        # どちらも Info.plist の用途説明キーはなく、メニューの文言で用途を示し、利用者の操作でだけ要求する
        # 挿入（Sources/Insertion）が使う Accessibility とイベント送信には、Info.plist の用途説明キーも Entitlement もない
        # （App Sandbox を使わないため。許可はシステム設定のアクセシビリティで行う）
  # 画面を除くロジックのユニットテスト。アプリを起動しないよう、テスト対象のソースを直接コンパイルする（TEST_HOST なし）
  UtterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Shortcut
      - path: Sources/Insertion
      - path: Sources/Session
      # Session が使う型（TaskHUDRefreshScheduler）と、表示の依頼のまとめ（HUDDisplayQueue）。パネルと画面は含めない
      - path: Sources/HUD/TaskHUDRefreshScheduler.swift
      - path: Sources/HUD/HUDDisplayQueue.swift
    dependencies:
      - package: UtterCore
      - package: UtterSpeech
      - package: UtterAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(UTTER_BUNDLE_ID_PREFIX).mac.tests
        GENERATE_INFOPLIST_FILE: "YES"
  # XPC STT Worker（モデルのロード・推論・解放, 4章 / AC-10）。アプリに組み込み、アプリからだけ接続する
  UtterSTTWorker:
    type: xpc-service
    platform: macOS
    sources:
      - path: ../../Workers/macOSSTT/Sources
    dependencies:
      - package: UtterSpeech
    settings:
      base:
        PRODUCT_NAME: UtterSTTWorker
        # アプリの Bundle ID に .stt-worker を付けたもの。アプリ側の XPCSTTWorkerConnector がこの名前で接続する
        PRODUCT_BUNDLE_IDENTIFIER: $(UTTER_BUNDLE_ID_PREFIX).mac.stt-worker
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: ../../Workers/macOSSTT/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        # Entitlement はマイク・ネットワークなどを使わないため付けない（PERM-01）
schemes:
  UtterMac:
    build:
      targets:
        UtterMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UtterMacTests
