# macOS アプリ（メニューバー常駐）の Xcode プロジェクト定義。
# 生成: xcodegen generate --spec Apps/macOS/project.yml
# 生成した Utter.xcodeproj はコミットしない（.gitignore。project.yml が正）。
# Team ID・Bundle ID は Config/Local.xcconfig（gitignore 済み）で上書きする（docs/ビルド・配布規約.md）。
name: Utter
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # Xcode のプロジェクトでは Package.resolved が生成物（*.xcodeproj）の中に置かれるため、
  # コミットした Apps/macOS/Package.resolved を生成のたびに中へ写す（docs/ビルド・配布規約.md「依存」）
  postGenCommand: ../../scripts/install-mac-package-resolved.sh
configFiles:
  Debug: ../../Config/Base.xcconfig
  Release: ../../Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  UtterCore:
    path: ../../Packages/UtterCore
  UtterPersistence:
    path: ../../Packages/UtterPersistence
  # 自動更新（Sparkle 2）。Phase 0 #47（依存のライセンス確定）の判定待ちの先行実装で、既定で無効。
  # 版を上げるときは docs/ライセンス・依存関係.md の表を再確認し、Package.resolved も更新する
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  UtterMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # 同梱する依存のライセンス表示（Sparkle の MIT と EXTERNAL LICENSES。バイナリ配布時に表示を含める義務がある）。
      # Contents/Resources/Licenses/ に入る。版を上げたら差し替える（scripts/verify.sh が取得した LICENSE と比べる）
      - path: Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: UtterCore
      - package: UtterPersistence
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: utter
        PRODUCT_BUNDLE_IDENTIFIER: $(UTTER_BUNDLE_ID_PREFIX).mac
        CODE_SIGN_STYLE: Automatic
        # 自前ビルドは各自の開発用証明書で署名する（既定の "-" は Ad Hoc になり、再ビルドで許可が外れる）。
        # 署名なしビルド（verify.sh・CI）と公式バイナリ（scripts/release-macos.sh）はコマンドラインで上書きする
        CODE_SIGN_IDENTITY: Apple Development
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        # 生成する Info.plist に足すキー（自動更新の設定。INFOPLIST_KEY_ で書けないもの）
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: utter
        # メニューバー常駐で Dock に出さない
        INFOPLIST_KEY_LSUIElement: "YES"
        # 権限の用途説明（マイク・Accessibility など）と Entitlement は、その機能を実装する PR で追加する（PERM-01）
        # Entitlement は UtterMac.entitlements に足す。Release は Hardened Runtime のため、
        # マイクを使うなら com.apple.security.device.audio-input が要る（scripts/check-release-config.sh が確かめる）
        CODE_SIGN_ENTITLEMENTS: UtterMac.entitlements
      configs:
        # 配布用（Developer ID 署名・公証、docs/ビルド・配布規約.md「リリース」）。公証には Hardened Runtime が必須
        Release:
          ENABLE_HARDENED_RUNTIME: "YES"
schemes:
  UtterMac:
    build:
      targets:
        UtterMac: all
    run:
      config: Debug
