# Phase i0 検証用（#56, #53）の iOS アプリ + カスタムキーボード拡張。本番コードではない。
# 生成: xcodegen generate --spec Verification/iOSKeyboardProbe/project.yml
# 生成した UtterKeyboardProbe.xcodeproj はコミットしない（.gitignore）。
name: UtterKeyboardProbe
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Probe.xcconfig
  Release: Config/Probe.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
# 待機セッションの試作（#233）は、認識・整形・共有結果を utter 本体と同じ Package で行う
packages:
  UtterCore:
    path: ../../Packages/UtterCore
  UtterSpeech:
    path: ../../Packages/UtterSpeech
  UtterAI:
    path: ../../Packages/UtterAI
  UtterPersistence:
    path: ../../Packages/UtterPersistence
targets:
  UtterKeyboardProbe:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: UtterKeyboardProbe
        PRODUCT_BUNDLE_IDENTIFIER: $(PROBE_BUNDLE_ID_PREFIX).keyboardprobe
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
    dependencies:
      - target: UtterKeyboardProbeKeyboard
        embed: true
      - package: UtterCore
      - package: UtterSpeech
      - package: UtterAI
      - package: UtterPersistence
  UtterKeyboardProbeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: UtterKeyboardProbeKeyboard
        PRODUCT_BUNDLE_IDENTIFIER: $(PROBE_BUNDLE_ID_PREFIX).keyboardprobe.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/Keyboard.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
    dependencies:
      - package: UtterCore
      - package: UtterPersistence
schemes:
  UtterKeyboardProbe:
    build:
      targets:
        UtterKeyboardProbe: all
        UtterKeyboardProbeKeyboard: all
    run:
      config: Debug
